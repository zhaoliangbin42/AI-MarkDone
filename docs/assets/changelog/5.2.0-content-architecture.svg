<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">AI-MarkDone 5.2.0 内容能力架构</title>
  <desc id="desc">ChatGPT 页面内容经过内容发现层和统一适配层，供目录、阅读器、导出、复制、书签、公式和字数统计使用。</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#10a37f"/>
      <stop offset="1" stop-color="#087f66"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#173b34" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#10a37f"/>
    </marker>
    <style>
      .title { font: 700 30px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #ffffff; }
      .subtitle { font: 400 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #d8fff3; }
      .section { font: 700 23px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #143a32; }
      .body { font: 400 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #35534d; }
      .small { font: 600 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #087f66; }
    </style>
  </defs>

  <rect width="1200" height="720" rx="28" fill="#f5faf8"/>
  <rect x="36" y="32" width="1128" height="112" rx="22" fill="url(#header)"/>
  <text x="72" y="83" class="title">ChatGPT 内容能力</text>
  <text x="72" y="116" class="subtitle">从页面内容到稳定、统一的功能体验</text>

  <g filter="url(#shadow)">
    <rect x="72" y="194" width="300" height="300" rx="22" fill="#ffffff" stroke="#c8e8df" stroke-width="2"/>
    <rect x="450" y="194" width="300" height="300" rx="22" fill="#ffffff" stroke="#c8e8df" stroke-width="2"/>
    <rect x="828" y="194" width="300" height="300" rx="22" fill="#ffffff" stroke="#c8e8df" stroke-width="2"/>
  </g>

  <circle cx="222" cy="244" r="24" fill="#e2f6f0"/>
  <circle cx="600" cy="244" r="24" fill="#e2f6f0"/>
  <circle cx="978" cy="244" r="24" fill="#e2f6f0"/>
  <text x="222" y="253" text-anchor="middle" class="small">1</text>
  <text x="600" y="253" text-anchor="middle" class="small">2</text>
  <text x="978" y="253" text-anchor="middle" class="small">3</text>

  <text x="222" y="307" text-anchor="middle" class="section">内容发现层</text>
  <text x="222" y="356" text-anchor="middle" class="body">识别对话内容</text>
  <text x="222" y="389" text-anchor="middle" class="body">发现新消息与公式</text>
  <text x="222" y="422" text-anchor="middle" class="body">保留已识别内容</text>

  <text x="600" y="307" text-anchor="middle" class="section">统一适配层</text>
  <text x="600" y="356" text-anchor="middle" class="body">整理为统一内容</text>
  <text x="600" y="389" text-anchor="middle" class="body">统一 Markdown 与公式</text>
  <text x="600" y="422" text-anchor="middle" class="body">提供稳定内容来源</text>

  <text x="978" y="307" text-anchor="middle" class="section">功能消费层</text>
  <text x="978" y="350" text-anchor="middle" class="body">目录与跳转 · 阅读器</text>
  <text x="978" y="383" text-anchor="middle" class="body">字数统计 · 导出</text>
  <text x="978" y="416" text-anchor="middle" class="body">复制 · 书签 · 公式</text>

  <line x1="382" y1="344" x2="438" y2="344" stroke="#10a37f" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="760" y1="344" x2="816" y2="344" stroke="#10a37f" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="162" y="560" width="876" height="78" rx="39" fill="#e2f6f0"/>
  <text x="600" y="608" text-anchor="middle" class="small">统一来源 · 减少重复识别 · 更可靠 · 更稳定 · 更成体系</text>
</svg>
